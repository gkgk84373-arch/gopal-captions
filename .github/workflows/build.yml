name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Keystore तैयार करो
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK बनाओ
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease -Pvcode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk GopalCaptions.apk

      - name: Release बनाओ
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: वर्ज़न ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: GopalCaptions.apk
